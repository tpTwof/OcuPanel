<svg font-family="-apple-system,BlinkMacSystemFont,&#39;Segoe UI&#39;,&#39;PingFang SC&#39;,&#39;Hiragino Sans GB&#39;,&#39;Microsoft YaHei&#39;,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 464" width="680" height="464" role="img" aria-label="第 7 个智能体：引用校验的删除、重生成与拒答">
<title>第 7 个智能体：引用校验的删除、重生成与拒答</title>
<desc>逐句核查后删除无依据内容，复核不通过则整篇重生成，轮次用尽则拒答不交报告</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8C959F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect fill="#FFFFFF" x="0" y="0" width="680" height="464" rx="8"/>

<rect fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" x="170" y="40" width="280" height="56" rx="10"/>
<text font-size="14" font-weight="500" fill="#1F2328" x="310" y="60" text-anchor="middle" dominant-baseline="central">逐句核查</text>
<text font-size="12" font-weight="400" fill="#57606A" x="310" y="78" text-anchor="middle" dominant-baseline="central">temperature=0，输出 JSON</text>

<path d="M310 96 L310 152" fill="none" stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" x="170" y="156" width="280" height="56" rx="10"/>
<text font-size="14" font-weight="500" fill="#1F2328" x="310" y="176" text-anchor="middle" dominant-baseline="central">删除或改写</text>
<text font-size="12" font-weight="400" fill="#57606A" x="310" y="194" text-anchor="middle" dominant-baseline="central">没依据的句子直接删</text>

<path d="M310 212 L310 268" fill="none" stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" x="170" y="272" width="280" height="56" rx="10"/>
<text font-size="14" font-weight="500" fill="#1F2328" x="310" y="292" text-anchor="middle" dominant-baseline="central">复核</text>
<text font-size="12" font-weight="400" fill="#57606A" x="310" y="310" text-anchor="middle" dominant-baseline="central">有效字数是否还成篇</text>

<path d="M450 300 L486 300" fill="none" stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" font-weight="400" fill="#6E7781" x="468" y="286" text-anchor="middle" dominant-baseline="central">合格</text>

<rect fill="#DAFBE1" stroke="#4AC26B" stroke-width="1" x="490" y="272" width="150" height="56" rx="10"/>
<text font-size="14" font-weight="500" fill="#1F2328" x="565" y="292" text-anchor="middle" dominant-baseline="central">通过</text>
<text font-size="12" font-weight="400" fill="#57606A" x="565" y="310" text-anchor="middle" dominant-baseline="central">可下载 PDF</text>

<path d="M310 328 L310 384" fill="none" stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" font-weight="400" fill="#6E7781" x="322" y="356" dominant-baseline="central">不合格</text>

<rect fill="#FFF8C5" stroke="#D4A72C" stroke-width="1" x="170" y="388" width="280" height="56" rx="10"/>
<text font-size="14" font-weight="500" fill="#1F2328" x="310" y="408" text-anchor="middle" dominant-baseline="central">整篇重生成</text>
<text font-size="12" font-weight="400" fill="#57606A" x="310" y="426" text-anchor="middle" dominant-baseline="central">附禁止清单，重跑一轮</text>

<path d="M450 416 L486 416" fill="none" stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" font-weight="400" fill="#6E7781" x="468" y="402" text-anchor="middle" dominant-baseline="central">用尽</text>

<rect fill="#FFEBE9" stroke="#FF8182" stroke-width="1" x="490" y="388" width="150" height="56" rx="10"/>
<text font-size="14" font-weight="500" fill="#1F2328" x="565" y="408" text-anchor="middle" dominant-baseline="central">拒答</text>
<text font-size="12" font-weight="400" fill="#57606A" x="565" y="426" text-anchor="middle" dominant-baseline="central">不交报告，422</text>

<path d="M170 416 L78 416 L78 68 L164 68" fill="none" stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" font-weight="400" fill="#6E7781" x="90" y="242" dominant-baseline="central">重跑，≤2 轮</text>
</svg>
